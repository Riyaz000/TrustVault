{% extends "base.html" %}
{% block title %}Register | TrustVault{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto"><div class="card-body p-4">
<h2>Create account</h2>
<p class="text-muted">Public registration cannot create administrator accounts.</p>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label mt-2">Full name</label><input class="form-control" name="full_name" maxlength="120" required>
  <label class="form-label mt-3">Email</label><input class="form-control" type="email" name="email" required autocomplete="email">
  <label class="form-label mt-3">Password (minimum 10 characters)</label><input class="form-control" type="password" name="password" minlength="10" required autocomplete="new-password">
  <label class="form-label mt-3">Role</label>
  <select class="form-select" name="role"><option value="viewer">Viewer</option><option value="owner">Owner</option></select>
  <button class="btn btn-primary w-100 mt-4">Register</button>
</form>
</div></div>
{% endblock %}
