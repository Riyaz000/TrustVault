{% extends "base.html" %}
{% block title %}Upload | TrustVault{% endblock %}
{% block content %}
<div class="form-card card shadow-sm"><div class="card-body p-4">
<h2>Upload a document</h2><p class="text-muted">Maximum 10 MB. Allowed types: PDF, TXT, PNG, JPG, DOCX, XLSX, CSV.</p>
<form method="post" enctype="multipart/form-data">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label class="form-label mt-2">Document title</label><input class="form-control" name="title" maxlength="255" required>
<label class="form-label mt-3">Category</label><select class="form-select" name="category"><option>General</option><option>Contract</option><option>Salary</option><option>Audit</option><option>Design</option><option>Report</option></select>
<label class="form-label mt-3">File</label><input class="form-control" type="file" name="file" required>
<button class="btn btn-primary mt-4">Upload securely</button>
</form></div></div>
{% endblock %}
