{% extends "base.html" %}
{% block title %}Login | TrustVault{% endblock %}
{% block content %}
<div class="form-card card shadow-sm mx-auto"><div class="card-body p-4">
<h2>Sign in</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label class="form-label mt-3">Email</label><input class="form-control" type="email" name="email" required autocomplete="email">
  <label class="form-label mt-3">Password</label><input class="form-control" type="password" name="password" required autocomplete="current-password">
  <button class="btn btn-primary w-100 mt-4">Login</button>
</form>
<p class="mt-3 mb-0">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div></div>
{% endblock %}
